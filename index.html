<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Paragem · Quinta do Conde</title>

<!-- PWA: manifest + theme color -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAFAF8">

<!-- iOS Safari 不完全依赖 manifest,需要这几个标签才能正确以全屏App方式启动 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paragem">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="place">Quinta do Conde</div>
      <div class="sub">Carris Metropolitana · tempo real</div>
    </div>
    <div class="live-pill">
      <span class="live-dot" id="liveDot"></span>
      <span id="liveLabel">ligado</span>
    </div>
  </div>

  <div class="favorites-row" id="favoritesRow" hidden></div>

  <div class="stop-bar">
    <button class="stop-current" id="stopCurrentBtn" type="button">
      <div class="stop-current-text">
        <span class="stop-current-name" id="stopCurrentName">—</span>
        <span class="stop-current-id" id="stopCurrentIdLabel"></span>
      </div>
      <span class="chev">▾</span>
    </button>
    <button class="fav-toggle" id="favToggleBtn" type="button" aria-label="Adicionar aos favoritos">☆</button>
  </div>

  <div class="target-row">
    <button class="target-chip" id="targetChipBtn" type="button"></button>
    <button class="target-clear" id="targetClearBtn" type="button" aria-label="Remover destino" hidden>✕</button>
  </div>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel">
      <div class="search-panel-head">
        <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="Procurar paragem por nome…">
        <button class="search-close" id="searchCloseBtn" type="button" aria-label="Fechar">✕</button>
      </div>
      <button class="nearby-btn" id="nearbyBtn" type="button">📍 usar a minha localização</button>
      <div class="search-hint" id="searchHint"></div>
      <div class="search-list" id="searchList"></div>
    </div>
  </div>

  <div class="stale-banner" id="staleBanner" hidden></div>

  <div class="board" id="board">
    <div class="state" id="state">A carregar horários…</div>
  </div>

  <div class="footer">
    <span id="updatedAt">—</span>
    <button class="refresh-btn" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/>
      </svg>
      atualizar
    </button>
  </div>

  <div class="note">
    Pesquisa entre todas as paragens da Carris Metropolitana · toque na paragem para trocar, ou em "definir destino" para saber se cada carro passa mesmo por onde você vai
  </div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
